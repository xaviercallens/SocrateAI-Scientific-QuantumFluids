[project]
name = "quantumfluids"
version = "0.1.0"
description = "SocrateAI-Scientific-QuantumFluids: dual-scale regularization in quantum-fluid physics"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
nexus = ["h5py>=3.8"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
